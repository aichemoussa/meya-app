# Builds MEYA for iPhone on GitHub's Macs, so no Mac of our own is needed.
#
# 1. "Build check" runs on every push to main and every version tag, with no
#    Apple account: it proves the iPhone app still compiles.
# 2. "TestFlight" runs on version tags once the Apple Developer account is set
#    up, signs the app and sends it to TestFlight. It stays off until the
#    repository variable APPLE_TEAM_ID exists.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables),
# public by design, the same values as tool/release.config.ps1:
#   MEYA_SUPABASE_URL, MEYA_SUPABASE_KEY, MEYA_REPORT_EMAIL
#   APPLE_TEAM_ID                         (from developer.apple.com > Membership)
# Repository secrets (only for TestFlight; never put them in this file):
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_KEY                 (the contents of the .p8 file)
#
# The Macs run macOS 26 with Xcode 26: Firebase's iPhone library (13 and up,
# used for pushes) does not build with the older Xcode 16.

name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build-check:
    name: Build check
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The encryption core (libsignal) needs protoc; Rust itself is installed
      # from native/meya_crypto/rust-toolchain.toml on first use.
      - name: Install protoc
        run: brew install protobuf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/meya_crypto

      - name: Build for iPhone (unsigned)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=MEYA_SUPABASE_URL=${{ vars.MEYA_SUPABASE_URL }} \
            --dart-define=MEYA_SUPABASE_KEY=${{ vars.MEYA_SUPABASE_KEY }} \
            --dart-define=MEYA_REPORT_EMAIL=${{ vars.MEYA_REPORT_EMAIL }}

  testflight:
    name: TestFlight
    needs: build-check
    if: startsWith(github.ref, 'refs/tags/v') && vars.APPLE_TEAM_ID != ''
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install protoc
        run: brew install protobuf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/meya_crypto

      - name: Prepare the App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      # Xcode creates and renews the signing certificate and profile itself,
      # using the App Store Connect key.
      - name: Build the signed app
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          flutter pub get
          flutter build ios --release --config-only \
            --dart-define=MEYA_SUPABASE_URL=${{ vars.MEYA_SUPABASE_URL }} \
            --dart-define=MEYA_SUPABASE_KEY=${{ vars.MEYA_SUPABASE_KEY }} \
            --dart-define=MEYA_REPORT_EMAIL=${{ vars.MEYA_REPORT_EMAIL }}
          cd ios
          pod install
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MEYA.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MEYA.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Send to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/ipa/*.ipa)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf ~/.appstoreconnect
