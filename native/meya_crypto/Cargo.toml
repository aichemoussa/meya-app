[package]
name = "meya_crypto"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
aes-gcm = "0.11.0"
ed25519-dalek = "2.2.0"
flutter_rust_bridge = "=2.13.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
openmls = { version = "0.9.0", features = ["openmls_rust_crypto"] }
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_sqlite_storage = "0.3.0"
sha2 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets"] }

# End-to-end encryption: Signal's maintained implementation of PQXDH and the
# Triple Ratchet (Double Ratchet + SPQR). AGPL-3.0-only, pinned to a release.
# Building it requires `protoc` on PATH.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", tag = "v0.105.0" }
async-trait = "0.1.79"
futures-util = "0.3"
rand = "0.9.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
